<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSports RDX</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --gold: #d29922;
            --green: #2ea44f;
            --red: #da3633;
            --text-white: #ffffff;
            --text-gray: #8b949e;
        }
        body {
            background-color: var(--bg-color);
            background-image: url('https://archive.org/download/image_5d0ed5192/image_5d0ed519~2.jpg');
            background-size: cover;
            background-blend-mode: overlay;
            color: var(--text-white);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: rgba(22, 27, 34, 0.95);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        header img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); }
        h1 { color: var(--gold); margin: 0; font-size: 22px; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn-green { background: var(--green); color: #fff; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-gray { background: #30363d; color: var(--text-gray); cursor: not-allowed; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .banner-img { width: 100%; height: 140px; border-radius: 8px; object-fit: cover; margin-bottom: 15px; border: 1px solid var(--gold); }
        .flex { display: flex; gap: 10px; }
        .timer { color: var(--red); font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <img src="https://archive.org/download/image_5d0ed5192/image_5d0ed519~2.jpg" alt="Logo">
        <h1>eSports RDX</h1>
    </header>

    <div class="container">
        <!-- Dynamic Banner -->
        <div id="bannerArea">
            <img src="https://archive.org/download/image_5d0ed5192/image_5d0ed519~2.jpg" class="banner-img" id="dynamicBanner">
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="card" style="text-align: center;">
            <h3>Login to Continue</h3>
            <button class="btn btn-green" onclick="loginWithGoogle()">Login with Google</button>
        </div>

        <!-- User Dashboard -->
        <div id="userSection" class="card" style="display:none;">
            <p>User: <span id="userName" style="color: var(--gold); font-weight:bold;"></span></p>
            <p>Wallet: ₹<span id="userWallet" style="color: var(--green); font-weight:bold;">0</span></p>
            <div class="flex">
                <button class="btn btn-green" onclick="openAddMoney()">Add Money</button>
                <button class="btn btn-red" onclick="openWithdraw()">Withdraw</button>
            </div>
            <button class="btn" style="background:#21262d; color:#fff; margin-top:10px;" onclick="toggleHistory()">My Joined History</button>
            <button class="btn btn-red" style="margin-top:5px;" onclick="logout()">Logout</button>
        </div>

        <!-- History Modal / Box -->
        <div id="historyBox" class="card" style="display:none;">
            <h3>Joined Matches History</h3>
            <div id="historyList">Loading history...</div>
        </div>

        <!-- Search Bar -->
        <input type="text" id="searchMatch" placeholder="Search by Match Title or ID..." onkeyup="filterMatches()">

        <h2>Tournaments</h2>
        <div id="matchesList">Loading matches...</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmBn7wouhYeKsLzZMoy21velN6XYT4JNo",
            authDomain: "ad-g-55646.firebaseapp.com",
            databaseURL: "https://ad-g-55646-default-rtdb.firebaseio.com",
            projectId: "ad-g-55646",
            storageBucket: "ad-g-55646.firebasestorage.app",
            messagingSenderId: "519103871395",
            appId: "1:519103871395:web:21b967c0dc5e646d9d8216",
            measurementId: "G-L4R8KEVLGY"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider).catch(e => alert(e.message));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('userSection').style.display = 'block';
                document.getElementById('userName').innerText = user.displayName;
                setupUserAccount(user);
                loadMatches();
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('userSection').style.display = 'none';
                loadMatches();
            }
        });

        function setupUserAccount(user) {
            db.collection("users").doc(user.uid).get().then(doc => {
                if (!doc.exists) {
                    db.collection("users").doc(user.uid).set({ wallet: 0, email: user.email, name: user.displayName });
                } else {
                    document.getElementById('userWallet').innerText = doc.data().wallet || 0;
                }
            });
        }

        db.collection("settings").doc("config").onSnapshot(doc => {
            if(doc.exists && doc.data().bannerUrl) {
                document.getElementById('dynamicBanner').src = doc.data().bannerUrl;
            }
        });

        // Load Matches & Check Joined status per user
        function loadMatches() {
            let user = auth.currentUser;
            
            db.collection("matches").onSnapshot(snapshot => {
                let html = "";
                if(snapshot.empty) {
                    document.getElementById('matchesList').innerHTML = "<p>No active matches.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    let m = doc.data();
                    let docId = doc.id;
                    if(m.status === "completed") return;

                    let maxSlots = m.maxSlots || 60;

                    html += `
                        <div class="card match-item" data-title="${m.title.toLowerCase()}" data-id="${m.matchId.toLowerCase()}">
                            <img src="${m.photoUrl || 'https://archive.org/download/image_5d0ed5192/image_5d0ed519~2.jpg'}" class="banner-img" style="height:100px;">
                            <h3 style="color:var(--gold); margin:5px 0;">${m.title} (ID: ${m.matchId})</h3>
                            <p>Entry Fee: ₹${m.entryFee} | Prize: ₹${m.prize} | Max Slots: ${maxSlots}</p>
                            <p>Time: <span class="timer" data-time="${m.time}">${m.time}</span></p>
                            
                            <div id="match-action-${docId}">
                                <button class="btn btn-green" onclick="joinMatch('${docId}', ${m.entryFee}, ${maxSlots})">Join Match</button>
                            </div>
                            <div id="match-details-${docId}" style="margin-top:8px;"></div>
                        </div>
                    `;
                });
                document.getElementById('matchesList').innerHTML = html;
                
                if(user) {
                    checkUserJoins(user.uid);
                }
            });
        }

        // Check if user already joined specific matches
        function checkUserJoins(uid) {
            db.collection("joins").where("userId", "==", uid).get().then(snapshot => {
                let joinedMatches = {};
                snapshot.forEach(doc => {
                    let data = doc.data();
                    joinedMatches[data.matchId] = data;
                });

                db.collection("matches").get().then(mSnap => {
                    mSnap.forEach(mDoc => {
                        let docId = mDoc.id;
                        let actionDiv = document.getElementById(`match-action-${docId}`);
                        let detailsDiv = document.getElementById(`match-details-${docId}`);

                        if(actionDiv && detailsDiv) {
                            if(joinedMatches[docId]) {
                                let jData = joinedMatches[docId];
                                actionDiv.innerHTML = `<button class="btn btn-gray" disabled>Joined Successfully</button>`;
                                detailsDiv.innerHTML = `
                                    <div style="background:#1f242d; padding:8px; border-radius:5px; font-size:13px; border:1px solid var(--gold);">
                                        <p style="margin:2px 0; color:var(--gold);"><b>User:</b> ${auth.currentUser.displayName}</p>
                                        <p style="margin:2px 0;"><b>FF ID:</b> ${jData.ffId}</p>
                                        <p style="margin:2px 0; color:var(--green);"><b>Room & Pass:</b> ${mDoc.data().roomDetails || 'Will be updated soon'}</p>
                                    </div>
                                `;
                            }
                        }
                    });
                });
            });
        }

        function joinMatch(matchId, entryFee, maxSlots) {
            let user = auth.currentUser;
            if(!user) { alert("Pehle login karein!"); return; }

            // Check if user already joined this match
            db.collection("joins").where("userId", "==", user.uid).where("matchId", "==", matchId).get().then(existingJoin => {
                if(!existingJoin.empty) {
                    alert("Aap is match ko pehle hi join kar chuke hain!");
                    return;
                }

                // Check slot limits
                db.collection("joins").where("matchId", "==", matchId).get().then(joinsSnap => {
                    if(joinsSnap.size >= maxSlots) {
                        alert("Match is Full! Max seat limit reached.");
                        return;
                    }

                    let ffId = prompt("Apni Free Fire (FF) ID enter karein:");
                    if(!ffId) return;

                    db.collection("users").doc(user.uid).get().then(userDoc => {
                        let wallet = userDoc.data().wallet || 0;
                        if(wallet < entryFee) { alert("Wallet me balance kam hai! Add Money karein."); return; }

                        db.collection("users").doc(user.uid).update({ wallet: wallet - entryFee });
                        db.collection("joins").add({
                            matchId: matchId,
                            userId: user.uid,
                            userName: user.displayName,
                            userEmail: user.email,
                            ffId: ffId,
                            timestamp: Date.now()
                        }).then(() => {
                            alert("Successfully Joined Match!");
                            loadMatches();
                        });
                    });
                });
            });
        }

        function openAddMoney() {
            let amt = prompt("Kitna amount add karna hai? (Jaise 10, 20, 50, 100):\nUPI: 9522856794@fam par payment karein.");
            if(!amt) return;
            let utr = prompt("Payment karne ke baad UTR / Transaction ID enter karein:");
            if(!utr) return;

            db.collection("withdrawals_or_deposits").add({
                userId: auth.currentUser.uid,
                email: auth.currentUser.email,
                type: "DEPOSIT",
                amount: Number(amt),
                utr: utr,
                status: "Pending",
                timestamp: Date.now()
            }).then(() => {
                alert("Deposit request bhej di gayi hai!");
            });
        }

        function openWithdraw() {
            let upi = prompt("Apni Withdrawal UPI ID enter karein:");
            if(!upi) return;
            let amt = prompt("Amount enter karein (Minimum ₹30):");
            if(!amt || Number(amt) < 30) { alert("Minimum withdrawal ₹30 hai!"); return; }

            db.collection("users").doc(auth.currentUser.uid).get().then(doc => {
                let wallet = doc.data().wallet || 0;
                if(wallet < Number(amt)) { alert("Insufficient balance!"); return; }

                db.collection("users").doc(auth.currentUser.uid).update({ wallet: wallet - Number(amt) });
                db.collection("withdrawals").add({
                    userId: auth.currentUser.uid,
                    email: auth.currentUser.email,
                    upi: upi,
                    amount: Number(amt),
                    status: "Pending",
                    timestamp: Date.now()
                }).then(() => {
                    alert("Withdrawal request submitted successfully!");
                });
            });
        }

        function toggleHistory() {
            let box = document.getElementById('historyBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            loadHistory();
        }

        function loadHistory() {
            let user = auth.currentUser;
            if(!user) return;
            db.collection("joins").where("userId", "==", user.uid).get().then(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    let d = doc.data();
                    html += `<p>Match Joined | FF ID: ${d.ffId} | Status: <b style="color:var(--green);">Joined</b></p><hr style="border-color:#30363d">`;
                });
                document.getElementById('historyList').innerHTML = html || "No history found.";
            });
        }

        function filterMatches() {
            let query = document.getElementById('searchMatch').value.toLowerCase();
            let items = document.querySelectorAll('.match-item');
            items.forEach(item => {
                let title = item.getAttribute('data-title');
                let id = item.getAttribute('data-id');
                if(title.includes(query) || id.includes(query)) {
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
