    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmBn7wouhYeKsLzZMoy21velN6XYT4JNo",
            authDomain: "ad-g-55646.firebaseapp.com",
            databaseURL: "https://ad-g-55646-default-rtdb.firebaseio.com",
            projectId: "ad-g-55646",
            storageBucket: "ad-g-55646.firebasestorage.app",
            messagingSenderId: "519103871395",
            appId: "1:519103871395:web:21b967c0dc5e646d9d8216",
            measurementId: "G-L4R8KEVLGY"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let monthlyVideoUrlGlobal = "";
        let currentFilterMode = 'joined';
        let lastActionTime = 0; 
        let timerInterval = null;
        let globalTasksCache = [];
        let allMatchesCache = [];
        let notifiedRoomsMap = {};

        const mapPhotos = {
            'lone wolf': 'https://archive.org/download/sddefault_20260629/sddefault.jpg',
            'battle royal': 'https://archive.org/download/3442-free-fire-battle-royale-guide/3442_Free-Fire_Battle-Royale-Guide.jpg',
            'headshot': 'https://archive.org/download/screenshot-20260629-171015-facebook/Screenshot_20260629-171015_Facebook.png',
            'classic squad': 'https://archive.org/download/photo_20260629/photo.jpg'
        };

        // Load Cached Data immediately on DOM startup so zero is never shown
        window.addEventListener('DOMContentLoaded', () => {
            let cachedName = localStorage.getItem('cache_topUserName') || "Gamer";
            let cachedWallet = localStorage.getItem('cache_topUserWallet') || "0";
            let cachedMatches = localStorage.getItem('cache_matchesList') || "<p style='color:var(--text-gray); text-align:center;'>Loading cached matches...</p>";
            let cachedTasks = localStorage.getItem('cache_dailyTasksList') || "<p style='font-size: 13px; color: var(--text-gray);'>Loading tasks...</p>";

            document.getElementById('topUserName').innerText = cachedName;
            document.getElementById('topUserWallet').innerText = cachedWallet;
            document.getElementById('matchesList').innerHTML = cachedMatches;
            document.getElementById('dailyTasksList').innerHTML = cachedTasks;

            // Check connection status
            if (!navigator.onLine) {
                document.getElementById('offlineModal').style.display = 'flex';
            }
        });

        window.addEventListener('online', () => {
            document.getElementById('offlineModal').style.display = 'none';
            retryConnection();
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineModal').style.display = 'flex';
        });

        function retryConnection() {
            if (navigator.onLine) {
                document.getElementById('offlineModal').style.display = 'none';
                if (auth.currentUser) {
                    setupUserAccount(auth.currentUser);
                    loadMatches();
                    loadDailyTasks(auth.currentUser.uid);
                } else {
                    loadMatches();
                    loadDailyTasks(null);
                }
            } else {
                alert("Internet is still offline. Please check your connection.");
            }
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider).catch(e => alert(e.message));
        }

        function logout() { 
            auth.signOut();
            localStorage.clear();
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('topUserName').innerText = "Guest User";
            document.getElementById('topUserWallet').innerText = "0";
            document.getElementById('matchesList').innerHTML = "<p style='color:var(--text-gray); text-align:center;'>Pehle login karein.</p>";
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authSection').style.display = 'none';
                
                // Instantly load user-specific cache if available to prevent 0 flashing
                let userSpecificWallet = localStorage.getItem('user_wallet_' + user.uid) || "0";
                let userSpecificName = localStorage.getItem('user_name_' + user.uid) || user.displayName || "User";
                
                document.getElementById('topUserWallet').innerText = userSpecificWallet;
                document.getElementById('topUserName').innerText = userSpecificName;
                document.getElementById('cache_topUserWallet').innerText = userSpecificWallet;

                setupUserAccount(user);
                loadMatches();
                loadDailyTasks(user.uid);
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('topUserName').innerText = "Guest User";
                document.getElementById('topUserWallet').innerText = "0";
                loadMatches();
                loadDailyTasks(null);
            }
        });

        function setupUserAccount(user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (!doc.exists) {
                    db.collection("users").doc(user.uid).set({ wallet: 0, email: user.email, name: user.displayName, hasDeposited: false });
                    document.getElementById('topUserWallet').innerText = "0";
                    localStorage.setItem('user_wallet_' + user.uid, "0");
                    localStorage.setItem('cache_topUserWallet', "0");
                } else {
                    let walletVal = doc.data().wallet || 0;
                    document.getElementById('topUserWallet').innerText = walletVal;
                    localStorage.setItem('user_wallet_' + user.uid, walletVal);
                    localStorage.setItem('cache_topUserWallet', walletVal);
                    if(doc.data().name) {
                        localStorage.setItem('user_name_' + user.uid, doc.data().name);
                        document.getElementById('topUserName').innerText = doc.data().name;
                        localStorage.setItem('cache_topUserName', doc.data().name);
                    }
                }
            }, error => {
                if (!navigator.onLine) {
                    document.getElementById('offlineModal').style.display = 'flex';
                }
            });
        }

        function loadDailyTasks(userId) {
            db.collection("tasks").onSnapshot(snapshot => {
                globalTasksCache = [];
                snapshot.forEach(doc => {
                    globalTasksCache.push({ id: doc.id, ...doc.data() });
                });
                renderTasksPreview(userId);
            }, error => {
                if (!navigator.onLine) document.getElementById('offlineModal').style.display = 'flex';
            });
        }

        function renderTasksPreview(userId) {
            let taskListEl = document.getElementById('dailyTasksList');
            if (globalTasksCache.length === 0) {
                let emptyMsg = `<p style="font-size: 13px; color: var(--text-gray);">No active tasks available right now.</p>`;
                taskListEl.innerHTML = emptyMsg;
                localStorage.setItem('cache_dailyTasksList', emptyMsg);
                return;
            }

            if (!userId) {
                let html = "";
                globalTasksCache.slice(0, 2).forEach(task => {
                    html += `
                        <div style="background: #080c14; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--card-border);">
                            <b style="font-size: 13px; color: #fff;">${task.title}</b>
                            <p style="font-size: 11px; color: var(--text-gray); margin: 2px 0;">${task.description || 'Complete this task to earn coins.'}</p>
                            <p style="font-size: 11px; color: var(--green); margin: 2px 0;">Reward: +${task.reward} Coins</p>
                            <button class="btn btn-green" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" onclick="alert('Please login first to complete tasks!')">Start Task</button>
                        </div>
                    `;
                });
                taskListEl.innerHTML = html;
                localStorage.setItem('cache_dailyTasksList', html);
                return;
            }

            db.collection("task_completions").where("userId", "==", userId).get().then(completionsSnap => {
                let completedTasks = {};
                completionsSnap.forEach(cDoc => { completedTasks[cDoc.data().taskId] = true; });

                let html = "";
                globalTasksCache.slice(0, 2).forEach(task => {
                    let isDone = completedTasks[task.id];
                    let actionBtn = isDone 
                        ? `<button class="btn btn-gray" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" disabled>Completed ✓</button>`
                        : `<button class="btn btn-green" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" onclick="startTask('${task.id}', '${task.link}', ${task.reward})">Start Task</button>`;

                    html += `
                        <div style="background: #080c14; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--card-border);">
                            <b style="font-size: 13px; color: #fff;">${task.title}</b>
                            <p style="font-size: 11px; color: var(--text-gray); margin: 2px 0;">${task.description || 'Complete this task to earn coins.'}</p>
                            <p style="font-size: 11px; color: var(--green); margin: 2px 0;">Reward: +${task.reward} Coins</p>
                            ${actionBtn}
                        </div>
                    `;
                });
                taskListEl.innerHTML = html;
                localStorage.setItem('cache_dailyTasksList', html);
            });
        }

        function openAllTasksModal() {
            document.getElementById('allTasksModal').style.display = 'flex';
            let container = document.getElementById('allTasksContainer');
            let user = auth.currentUser;

            if (globalTasksCache.length === 0) {
                container.innerHTML = `<p style="font-size: 13px; color: var(--text-gray);">No tasks available.</p>`;
                return;
            }

            if (!user) {
                let html = "";
                globalTasksCache.forEach(task => {
                    html += `
                        <div style="background: #080c14; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--card-border);">
                            <b style="font-size: 13px; color: #fff;">${task.title}</b>
                            <p style="font-size: 11px; color: var(--text-gray); margin: 2px 0;">${task.description || ''}</p>
                            <p style="font-size: 11px; color: var(--green); margin: 2px 0;">Reward: +${task.reward} Coins</p>
                            <button class="btn btn-green" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" onclick="alert('Please login first!')">Start Task</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
                return;
            }

            db.collection("task_completions").where("userId", "==", user.uid).get().then(completionsSnap => {
                let completedTasks = {};
                completionsSnap.forEach(cDoc => { completedTasks[cDoc.data().taskId] = true; });

                let html = "";
                globalTasksCache.forEach(task => {
                    let isDone = completedTasks[task.id];
                    let actionBtn = isDone 
                        ? `<button class="btn btn-gray" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" disabled>Completed ✓</button>`
                        : `<button class="btn btn-green" style="padding: 6px 12px; font-size: 12px; margin-top: 5px;" onclick="startTask('${task.id}', '${task.link}', ${task.reward})">Start Task</button>`;

                    html += `
                        <div style="background: #080c14; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--card-border);">
                            <b style="font-size: 13px; color: #fff;">${task.title}</b>
                            <p style="font-size: 11px; color: var(--text-gray); margin: 2px 0;">${task.description || ''}</p>
                            <p style="font-size: 11px; color: var(--green); margin: 2px 0;">Reward: +${task.reward} Coins</p>
                            ${actionBtn}
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        function closeAllTasksModal() { document.getElementById('allTasksModal').style.display = 'none'; }

        function startTask(taskId, taskLink, reward) {
            let user = auth.currentUser;
            if(!user) { alert("Please login first!"); return; }
            let finalUrl = taskLink.includes("?") ? `${taskLink}&subId=${user.uid}&taskId=${taskId}` : `${taskLink}?subId=${user.uid}&taskId=${taskId}`;
            window.open(finalUrl, '_blank');
            alert(`Task opened! Complete instructions. +${reward} coins will be credited automatically upon server verification.`);
        }

        db.collection("settings").doc("config").onSnapshot(doc => {
            if(doc.exists) {
                let data = doc.data();
                if(data.bannerUrl) document.getElementById('dynamicBanner').src = data.bannerUrl;
                if(data.monthlyVideoUrl) monthlyVideoUrlGlobal = data.monthlyVideoUrl;
            }
        });

        function openMonthlyEventModal() {
            document.getElementById('monthlyEventModal').style.display = 'flex';
            let container = document.getElementById('monthlyVideoContainer');
            if(monthlyVideoUrlGlobal) {
                container.innerHTML = `<iframe width="100%" height="220" src="${monthlyVideoUrlGlobal}" frameborder="0" allowfullscreen style="border-radius:8px;"></iframe>`;
            } else {
                container.innerHTML = `<p style="color:var(--red);">No event video uploaded by admin yet!</p>`;
            }
        }
        function closeMonthlyEventModal() { document.getElementById('monthlyEventModal').style.display = 'none'; }

        function loadMatches() {
            let user = auth.currentUser;
            db.collection("matches").onSnapshot(snapshot => {
                if(snapshot.empty) {
                    let msg = "<p style='color:var(--text-gray); text-align:center;'>No active matches found.</p>";
                    document.getElementById('matchesList').innerHTML = msg;
                    localStorage.setItem('cache_matchesList', msg);
                    allMatchesCache = [];
                    return;
                }

                db.collection("joins").get().then(joinsSnap => {
                    let joinCounts = {};
                    let userJoinedMatches = {};
                    allMatchesCache = [];

                    joinsSnap.forEach(jDoc => {
                        let jData = jDoc.data();
                        let mId = jData.matchId;
                        joinCounts[mId] = (joinCounts[mId] || 0) + 1;
                        if(user && jData.userId === user.uid) {
                            userJoinedMatches[mId] = true;
                        }
                    });

                    let html = "";
                    snapshot.forEach(doc => {
                        let m = doc.data();
                        let docId = doc.id;
                        let titleLower = (m.title || "").toLowerCase();
                        
                        allMatchesCache.push({ docId, title: m.title, matchId: m.matchId, data: m, joinCounts, userJoinedMatches });

                        if (currentFilterMode === 'joined') {
                            if (!user || !userJoinedMatches[docId]) return;
                        } else {
                            if (!titleLower.includes(currentFilterMode)) return;
                        }

                        html += buildMatchCardHTML(docId, m, joinCounts, userJoinedMatches);
                    });
                    
                    let defaultMsg = user ? "<p style='color:var(--text-gray); text-align:center;'>Aapne abhi tak koi match join nahi kiya hai.</p>" : "<p style='color:var(--text-gray); text-align:center;'>Pehle login karein.</p>";
                    let finalContent = html || defaultMsg;
                    
                    document.getElementById('matchesList').innerHTML = finalContent;
                    localStorage.setItem('cache_matchesList', finalContent);
                    
                    if(user) checkUserJoins(user.uid);
                });
            }, error => {
                if (!navigator.onLine) document.getElementById('offlineModal').style.display = 'flex';
            });
        }

        function buildMatchCardHTML(docId, m, joinCounts, userJoinedMatches) {
            let titleLower = (m.title || "").toLowerCase();
            let maxSlots = m.maxSlots || 60;
            let filledCount = joinCounts[docId] || 0;
            let percent = (filledCount / maxSlots) * 100;
            if(percent > 100) percent = 100;

            let feeDisplay = m.entryFee === 0 ? '<span style="color:var(--green); font-weight:bold;">FREE Match</span>' : `Entry Fee: ₹${m.entryFee}`;

            let autoPhoto = 'https://archive.org/download/image_5d0ed5192/image_5d0ed519~2.jpg';
            if (titleLower.includes('lone wolf')) autoPhoto = mapPhotos['lone wolf'];
            else if (titleLower.includes('battle royal') || titleLower.includes('battle royale')) autoPhoto = mapPhotos['battle royal'];
            else if (titleLower.includes('headshot')) autoPhoto = mapPhotos['headshot'];
            else if (titleLower.includes('classic squad') || titleLower.includes('squad')) autoPhoto = mapPhotos['classic squad'];

            let matchPhoto = m.photoUrl || m.bannerUrl || autoPhoto;
            let isCompleted = m.status === "completed";
            let actionButtonHtml = isCompleted ? `<button class="btn btn-gray" disabled>Match Completed</button>` : `<div id="match-action-${docId}"><button class="btn btn-green" onclick="openJoinModal('${docId}', ${m.entryFee}, '${m.title}', '${m.matchType || 'solo'}')">Join Match</button></div>`;

            return `
                <div class="card match-item">
                    <img src="${matchPhoto}" class="banner-img" style="height:120px;">
                    <h3 style="color:var(--gold); margin:5px 0;">${m.title} (ID: ${m.matchId || 'N/A'})</h3>
                    <p style="margin:4px 0;">${feeDisplay} | Prize: ₹${m.prize}</p>
                    <p style="margin:4px 0;">Joined: <b>${filledCount} / ${maxSlots}</b> Slots</p>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${percent}%;"></div>
                    </div>
                    <p style="margin:4px 0;">Time: <span class="timer">${m.time}</span></p>
                    ${actionButtonHtml}
                    <div id="match-details-${docId}" style="margin-top:8px;"></div>
                </div>
            `;
        }

        function openSearchPopup() {
            document.getElementById('searchPopupOverlay').style.display = 'flex';
            document.getElementById('popupSearchInput').focus();
            executePopupSearch();
        }
        function closeSearchPopup() {
            document.getElementById('searchPopupOverlay').style.display = 'none';
        }

        function executePopupSearch() {
            let query = document.getElementById('popupSearchInput').value.toLowerCase().trim();
            let container = document.getElementById('popupSearchResults');

            if (allMatchesCache.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-gray);">No matches loaded yet.</p>`;
                return;
            }

            let filtered = allMatchesCache.filter(item => {
                let t = (item.title || "").toLowerCase();
                let mid = item.matchId ? String(item.matchId).toLowerCase() : "";
                let docId = item.docId.toLowerCase();
                if(query === "") return true;
                return t.includes(query) || mid.includes(query) || docId.includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--red);">No matching matches found for "${query}"</p>`;
                return;
            }

            let html = "";
            filtered.forEach(item => {
                html += buildMatchCardHTML(item.docId, item.data, item.joinCounts, item.userJoinedMatches);
            });
            container.innerHTML = html;
            if(auth.currentUser) {
                filtered.forEach(item => checkUserJoins(auth.currentUser.uid));
            }
        }

        function checkUserJoins(uid) {
            db.collection("joins").where("userId", "==", uid).get().then(snapshot => {
                let joinedMatches = {};
                snapshot.forEach(doc => {
                    let data = doc.data();
                    joinedMatches[data.matchId] = data;
                });

                db.collection("matches").get().then(mSnap => {
                    mSnap.forEach(mDoc => {
                        let docId = mDoc.id;
                        let mData = mDoc.data();
                        let actionDiv = document.getElementById(`match-action-${docId}`);
                        let detailsDiv = document.getElementById(`match-details-${docId}`);

                        if(joinedMatches[docId]) {
                            let jData = joinedMatches[docId];
                            if (actionDiv && mData.status !== "completed") {
                                actionDiv.innerHTML = `<button class="btn btn-gray" disabled>Joined Successfully</button>`;
                            }
                            
                            let roomInfo = mData.roomDetails && mData.roomDetails !== 'Pending' ? mData.roomDetails : 'Will be updated soon by Admin';
                            
                            if (mData.roomDetails && mData.roomDetails !== 'Pending' && !notifiedRoomsMap[docId]) {
                                notifiedRoomsMap[docId] = true;
                                showRoomNotificationPopup(mData.title, mData.roomDetails);
                            }

                            let teamInfoText = jData.teamType ? `(${jData.teamType.toUpperCase()} - Team ID: ${jData.ffId2 ? 'Team A & B' : 'Team A'})` : '';
                            if(detailsDiv) {
                                detailsDiv.innerHTML = `
                                    <div style="background:#080c14; padding:8px; border-radius:5px; font-size:13px; border:1px solid var(--gold);">
                                        <p style="margin:2px 0; color:var(--gold);"><b>User Name:</b> ${auth.currentUser ? auth.currentUser.displayName : "User"} ${teamInfoText}</p>
                                        <p style="margin:2px 0;"><b>FF ID(s):</b> ${jData.ffId} ${jData.ffId2 ? ' / ' + jData.ffId2 : ''}</p>
                                        <p style="margin:2px 0; color:var(--green);"><b>Room ID & Pass:</b> ${roomInfo}</p>
                                    </div>
                                `;
                            }
                        }
                    });
                });
            });
        }

        function showRoomNotificationPopup(matchTitle, roomDetails) {
            document.getElementById('popupRoomContent').innerHTML = `
                <p style="margin:0 0 4px 0; color:#fff;">🏆 ${matchTitle}</p>
                <span style="color:var(--green); font-size:15px; word-break:break-all;">${roomDetails}</span>
            `;
            document.getElementById('roomNotificationModal').style.display = 'flex';
        }

        function closeRoomNotificationModal() {
            document.getElementById('roomNotificationModal').style.display = 'none';
        }

        let activeJoinMatchId = null;
        let activeJoinFee = 0;
        let activeJoinTitle = "";
        let activeMatchType = "solo";

        function openJoinModal(matchId, entryFee, matchTitle, matchType) {
            let user = auth.currentUser;
            if(!user) { alert("Pehle login karein!"); return; }

            activeJoinMatchId = matchId;
            activeJoinFee = entryFee;
            activeJoinTitle = matchTitle;
            activeMatchType = (matchType || "solo").toLowerCase();

            if (activeMatchType.includes('duo') || activeMatchType.includes('squad') || activeMatchType.includes('custom') || activeMatchType === 'a_b') {
                showTeamSelectionModal();
            } else {
                joinMatchDirect(activeJoinMatchId, activeJoinFee, activeJoinTitle, 'solo', prompt("Apni Free Fire (FF) ID enter karein:"), "");
            }
        }

        function showTeamSelectionModal() {
            let modalHtml = `
                <div id="dynamicTeamModal" class="modal" style="display:flex; z-index: 3000;">
                    <div class="modal-content">
                        <h3 style="color:var(--gold); margin-top:0;">🎮 Select Team & Enter FF IDs</h3>
                        <p style="font-size: 13px; color: var(--text-gray);">Yeh match Duo/Squad hai. Aap Team A ya Team B me join kar sakte hain.</p>
                        
                        <div class="team-box">
                            <h5>Team A</h5>
                            <label style="font-size:11px; color:var(--text-gray); display:block; text-align:left;">Player 1 FF ID (Required):</label>
                            <input type="text" id="teamA_p1" placeholder="Enter Player 1 FF ID" style="margin:4px 0 8px 0;">
                            
                            <label style="font-size:11px; color:var(--text-gray); display:block; text-align:left;">Player 2 FF ID (Optional):</label>
                            <input type="text" id="teamA_p2" placeholder="Enter Player 2 FF ID (Optional)" style="margin:4px 0 4px 0;">
                        </div>

                        <div class="team-box">
                            <h5>Team B (Alternate / Rival)</h5>
                            <label style="font-size:11px; color:var(--text-gray); display:block; text-align:left;">Player 1 FF ID (Optional):</label>
                            <input type="text" id="teamB_p1" placeholder="Enter Player 1 FF ID" style="margin:4px 0 8px 0;">
                            
                            <label style="font-size:11px; color:var(--text-gray); display:block; text-align:left;">Player 2 FF ID (Optional):</label>
                            <input type="text" id="teamB_p2" placeholder="Enter Player 2 FF ID (Optional)" style="margin:4px 0 4px 0;">
                        </div>

                        <button class="btn btn-green" onclick="submitTeamJoin()" style="margin-top:10px;">Confirm & Join Match</button>
                        <button class="btn btn-red" onclick="document.getElementById('dynamicTeamModal').remove()">Cancel</button>
                    </div>
                </div>
            `;
            let div = document.createElement('div');
            div.innerHTML = modalHtml;
            document.body.appendChild(div);
        }

        function submitTeamJoin() {
            let p1 = document.getElementById('teamA_p1').value.trim();
            let p2 = document.getElementById('teamA_p2').value.trim();
            let b1 = document.getElementById('teamB_p1').value.trim();
            let b2 = document.getElementById('teamB_p2').value.trim();

            let totalPlayersCount = 0;
            let primaryFFId = "";
            let secondaryFFId = "";
            let chosenTeam = "Team A";

            if (p1 !== "") { totalPlayersCount++; primaryFFId = p1; }
            if (p2 !== "") { totalPlayersCount++; secondaryFFId = p2; chosenTeam = "Team A (2 Players)"; }
            
            if (b1 !== "" || b2 !== "") {
                if (totalPlayersCount === 0) {
                    chosenTeam = "Team B";
                    if (b1 !== "") { totalPlayersCount++; primaryFFId = b1; }
                    if (b2 !== "") { totalPlayersCount++; secondaryFFId = b2; }
                } else {
                    if (b1 !== "") secondaryFFId = secondaryFFId ? secondaryFFId + ", " + b1 : b1;
                    if (b2 !== "") secondaryFFId = secondaryFFId ? secondaryFFId + ", " + b2 : b2;
                    totalPlayersCount += (b1 !== "" ? 1 : 0) + (b2 !== "" ? 1 : 0);
                }
            }

            if (totalPlayersCount === 0 || primaryFFId === "") {
                alert("Kam se kam Player 1 ki Free Fire ID enter karna anivarya hai!");
                return;
            }

            let finalEntryFee = activeJoinFee * totalPlayersCount;
            document.getElementById('dynamicTeamModal').remove();

            joinMatchDirect(activeJoinMatchId, finalEntryFee, activeJoinTitle, chosenTeam, primaryFFId, secondaryFFId);
        }

        function joinMatchDirect(matchId, totalFee, matchTitle, teamType, ffId1, ffId2) {
            let user = auth.currentUser;
            if(!user) { alert("Pehle login karein!"); return; }

            let currentTime = Date.now();
            if (currentTime - lastActionTime < 3000) return;
            lastActionTime = currentTime;

            db.collection("users").doc(user.uid).get().then(userDoc => {
                let userData = userDoc.data() || {};
                let wallet = userData.wallet || 0;

                if(wallet < totalFee) { 
                    alert(`Wallet me balance kam hai! Required: ₹${totalFee}, Available: ₹${wallet}. Add Money karein.`); 
                    return; 
                }

                db.collection("users").doc(user.uid).update({ wallet: wallet - totalFee }).then(() => {
                    db.collection("joins").add({
                        matchId: matchId,
                        userId: user.uid,
                        userName: user.displayName,
                        ffId: ffId1,
                        ffId2: ffId2 || "",
                        teamType: teamType,
                        totalPaid: totalFee,
                        timestamp: Date.now()
                    }).then(() => {
                        alert(`Successfully Joined ${matchTitle} (${teamType})! Fee deducted: ₹${totalFee}`);
                        loadMatches();
                    });
                });
            });
        }

        function toggleWithdrawalHistoryModal() {

            let listEl = document.getElementById('withdrawalHistoryList');
            if(!user) { listEl.innerHTML = "Pehle login karein!"; return; }

            db.collection("withdrawals").where("userId", "==", user.uid).get().then(snap => {

        function closeSupportModal() { document.getElementById('supportModal').style.display = 'none'; }
        function openAddMoneyModal() { document.getElementById('addMoneyModal').style.display = 'flex'; }
        function closeAddMoneyModal() { document.getElementById('addMoneyModal').style.display = 'none'; document.getElementById('qrDisplaySection').style.display = 'none'; clearInterval(timerInterval); }

        async function initiateDynamicQRPayment(baseAmount) {
            let user = auth.currentUser;
            if (!user) { alert("Please login first!"); return; }

            let decimals = { 10: 0.31, 20: 0.52, 30: 0.74, 50: 0.15, 100: 0.99, 150: 0.22, 200: 0.38, 300: 0.45, 500: 0.67, 1000: 0.88 };
            let finalAmount = baseAmount + (decimals[baseAmount] || 0.10);
            let exactAmtStr = finalAmount.toFixed(2);
            let txnId = "TXN_" + Date.now();

            try {
                await db.collection('withdrawals_or_deposits').doc(txnId).set({
                    userId: user.uid,
                    amount: parseFloat(exactAmtStr),
                    requestedAmount: baseAmount,
                    txnId: txnId,
                    status: "Pending",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                let upiUrl = `upi://pay?pa=9522856794@fam&pn=EsportsRDX&am=${exactAmtStr}&cu=INR&tr=${txnId}`;
                document.getElementById('dynamicQRImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUrl)}`;
                document.getElementById('qrExactAmount').innerText = exactAmtStr;
                document.getElementById('qrDisplaySection').style.display = 'block';
                startTimer(240);
            } catch (error) {
                alert("Failed to initiate payment request.");
            }
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            let timer = duration;
            let timerDisplay = document.getElementById('timer');
            timerInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);
                timerDisplay.innerText = minutes + ":" + (seconds < 10 ? "0" + seconds : seconds);
                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('qrDisplaySection').style.display = 'none';
                }
            }, 1000);
        }

        function openWithdraw() { document.getElementById('withdrawalModal').style.display = 'flex'; }
        function closeWithdrawalModal() { document.getElementById('withdrawalModal').style.display = 'none'; }

        function submitWithdrawal(amt) {
            let user = auth.currentUser;
            if(!user) return;
            let upi = prompt("Apni Withdrawal UPI ID enter karein:");
            if(!upi || !upi.includes("@")) { alert("Please enter a valid UPI ID!"); return; }

            db.collection("users").doc(user.uid).get().then(doc => {
                let wallet = doc.data().wallet || 0;
                if(wallet < amt) { alert("Insufficient balance!"); return; }

                db.collection("users").doc(user.uid).update({ wallet: wallet - amt }).then(() => {
                    db.collection("withdrawals").add({
                        userId: user.uid,
                        upi: upi.trim(),
                        amount: amt,
                        status: "Pending",
                        timestamp: Date.now()
                    }).then(() => {
                        alert("Withdrawal request submitted successfully!");
                        closeWithdrawalModal();
                    });
                });
            });
        }
